# Netlify: static multi-page site. Each route is a folder with its own index.html,
# so /meet-duke/ and /work/bahia-taste/ open directly by URL. No SPA fallback.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Old anchors from the previous site still land on the form.
[[redirects]]
  from = "/waitlist"
  to = "/#waitlist"
  status = 301
