<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="sp" d="M12 0C12.8 6.5 17.5 11.2 24 12C17.5 12.8 12.8 17.5 12 24C11.2 17.5 6.5 12.8 0 12C6.5 11.2 11.2 6.5 12 0Z"/></defs></svg>
<a class="skip" href="#main">Skip to content</a>
<header class="site"><div class="in wrap">
  <a class="logo" href="../"><img src="../assets/img/brand/hustleq-wordmark-ink.png" alt="HustleQ" width="108" height="22"></a>
  <nav class="main" aria-label="Main"><a href="../#product">Product</a><a href="./" class="active" aria-current="page"><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><use href="#sp" fill="currentColor"/></svg>The Work</a><a href="../#ways-in">Ways In</a><a href="../meet-duke/" class="demo">Meet Duke</a></nav>
  <div class="hcta"><a class="primary" href="../#form">Join the waitlist</a></div>
</div></header>
<main id="main" class="wrap" style="padding-top:56px;padding-bottom:96px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:16px;max-width:760px">
    <span class="eyebrow"><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><use href="#sp" fill="currentColor"/></svg>The Work</span>
    <h1 class="h2" style="font-size:clamp(44px,6vw,88px)">Work we made by hand.</h1>
    <p class="lead" style="color:var(--body)">Content our team planned and made for real businesses, before Duke.</p>
  </div>
  <div class="work-grid" id="work-grid"></div>
</main>
<footer class="site"><div class="wrap"><div class="bot" style="margin-top:0;border-top:0;padding-top:0"><span>© 2026 HustleQ</span><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#sp" fill="var(--signal)"/></svg></div></div></footer>
<script src="../assets/js/work-data.js"></script>
<script>
(function(){
  var grid=document.getElementById('work-grid'), P='../';
  window.HQ_WORK.forEach(function(p){
    var a=document.createElement('a'); a.className='tile'; a.href=p.slug+'/'; a.setAttribute('aria-label',p.name+', view case');
    a.innerHTML='<div class="img"><img loading="lazy" sizes="(max-width:900px) 100vw, 33vw"></div><div class="row1"><span class="name"></span><span class="go">View case →</span></div><span class="meta"></span>';
    var img=a.querySelector('img'); img.src=P+p.image.src; img.srcset=p.image.srcset.split(', ').map(function(s){return P+s;}).join(', '); img.alt=p.image.alt; if(p.image.position) img.style.objectPosition=p.image.position;
    a.querySelector('.name').textContent=p.name; a.querySelector('.meta').textContent=p.meta||'';
    grid.appendChild(a);
  });
  grid.style.gridTemplateColumns='repeat(auto-fill,minmax(280px,1fr))';
})();
</script>
</body>
